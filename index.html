<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pin it Your Way – Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pin it Your Way is an experimental Pinterest extension project currently in development.">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #faf8f6;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #202020;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .logo {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 900;
      font-size: 3.6rem;
      letter-spacing: 0.2em;
      color: #D46A6A; /* Muted red */
      background: linear-gradient(45deg, #D46A6A, #b44545);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-shadow: 1px 1px 3px rgba(180, 70, 70, 0.7);
      transition: color 0.3s ease;
      user-select: none;
      cursor: default;
      margin-bottom: 0.5rem;
      letter-spacing: 0.2em;
      margin-top: 3rem;
    }
    .logo:hover {
      color: #b44545;
      text-shadow: 2px 2px 6px rgba(180, 70, 70, 0.9);
    }
    .subtitle {
      color: #666;
      font-size: 1.25rem;
      margin-bottom: 2rem;
    }
    .status {
      background: #ffe6ea;
      color: #b44545;
      display: inline-block;
      padding: 0.6em 1.4em;
      border-radius: 2em;
      font-size: 1.1em;
      margin-bottom: 2.5rem;
      font-weight: 500;
    }
    a.button {
      display: inline-block;
      background: #D46A6A; /* Muted red */
      color: white;
      text-decoration: none;
      border-radius: 2em;
      padding: 0.9em 2em;
      font-weight: 600;
      margin-top: 2.2rem;
      transition: background 0.2s;
    }
    a.button:hover {
      background: #b44545;
    }
    footer {
      padding: 1.2rem 0;
      font-size: 0.96rem;
      color: #777;
      text-align: center;
      border-top: 1px solid #f1d7de;
      background: #faf2f7;
    }
    .links a {
      color: #D46A6A;
      text-decoration: none;
      margin: 0 1em;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">📌 Pin it Your Way</div>
    <div class="subtitle">A smarter way to pin to Pinterest<br>(Browser Extension – Work in Progress)</div>
    <div class="status">This extension project is currently in active development.<br>
      <span style="font-size:0.92em;">Stay tuned for updates.</span>
    </div>
    <a href="privacy.html" class="button">Privacy Policy</a>
  </main>
  <footer>
    &copy; 2025 Pin it Your Way. All rights reserved.
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      &middot; 
      <a href="mailto:[email protected]">Contact</a>
    </div>
  </footer>
</body>
</html>
